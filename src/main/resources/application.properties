spring.application.name=porfolio

#CONFIG DU SERVEUR
server.port=${PORT:8080}
server.address=0.0.0.0
server.servlet.context-path=/

#CONFIRGURATION MYSQL (XAMPP)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


#CONFIG JPA / HIBERNATE
#UPDATE MET A JOUR LA STRUCTURE DES TABLES SNS SUPPIMER LES DONNESS EXISTANTES
spring.jpa.hibernate.ddl-auto =update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


#CONFIG MULTIPART (UPLOAD DE FICHIERS / IMAGES & CV)
#PERMET DE GERER L'ENVOI MULTIPLE D'IMAGES POUR LA SECTION PROJETS(JUSQU'A 12 IMAGES)

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

#CONFIGURATION THYMELEAF
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

#Email

spring.mail.host=smtp.gmail.com
